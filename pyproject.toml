[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokamak-rl-control-suite"
version = "2.0.0"
description = "Reinforcement learning for plasma control in tokamak fusion reactors"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name = "Daniel Schmidt"},
]
keywords = [
    "reinforcement-learning",
    "plasma-physics",
    "tokamak",
    "fusion-energy",
    "MHD-stability",
    "disruption-avoidance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/danieleschmidt/tokamak-rl-control-suite"
Repository = "https://github.com/danieleschmidt/tokamak-rl-control-suite.git"
Issues = "https://github.com/danieleschmidt/tokamak-rl-control-suite/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tokamak_rl"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
