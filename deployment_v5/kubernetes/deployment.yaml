apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokamak-rl-api
  namespace: tokamak-rl-production
  labels:
    app: tokamak-rl
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tokamak-rl
      tier: api
  template:
    metadata:
      labels:
        app: tokamak-rl
        tier: api
    spec:
      containers:
      - name: tokamak-rl
        image: tokamak-rl:latest
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONPATH
          value: "/app/src"
        - name: TOKAMAK_ENV
          value: "production"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: config-volume
        configMap:
          name: tokamak-rl-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: tokamak-rl-pvc
